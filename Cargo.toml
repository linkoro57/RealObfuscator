[package]
name = "realobfuscator"
version = "2.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A layered Luau obfuscator for Roblox projects"

[dependencies]
darklua = "0.19.0"
full_moon = { version = "2.2.0", features = ["roblox"] }
getrandom = "0.3"
stacker = "0.1.25"

[lib]
name = "realobfuscator"
path = "src/lib.rs"

[[bin]]
name = "realobfuscator"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

