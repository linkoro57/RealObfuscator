[package]
name = "realobfuscator"
version = "2.2.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Free, open-source Lua/Luau source obfuscator for Roblox, written in Rust"
repository = "https://github.com/linkoro57/RealObfuscator"
documentation = "https://github.com/linkoro57/RealObfuscator#readme"
readme = "README.md"
keywords = ["lua", "luau", "obfuscator", "roblox", "cli"]
categories = ["command-line-utilities"]

[dependencies]
darklua = "0.19.0"
full_moon = { version = "2.2.0", features = ["roblox"] }
getrandom = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[workspace]
members = ["web/engine"]
default-members = ["."]
resolver = "2"

[lib]
name = "realobfuscator"
path = "src/lib.rs"

[[bin]]
name = "realobfuscator"
path = "src/main.rs"

[[bench]]
name = "obfuscation"
path = "benches/obfuscation.rs"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

