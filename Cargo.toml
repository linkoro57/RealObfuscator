[package]
name = "realobfuscator"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A layered Luau obfuscator for Roblox projects"

[lib]
name = "realobfuscator"
path = "src/lib.rs"

[[bin]]
name = "realobfuscator"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

