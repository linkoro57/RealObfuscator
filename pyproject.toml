[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realobfuscator"
dynamic = ["version"]
description = "A command-line Luau obfuscator for Roblox scripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["click>=8.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
realobfuscator = "main:main"

[tool.setuptools]
py-modules = ["config", "main", "obfuscator", "version"]
packages = ["layers", "layers.vm", "parser", "utils"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
